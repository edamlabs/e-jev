##### BUILD #####
[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-jev"
version = "0.3.0"
description = "A self-hosted Jev with a catalog of decision backends — typed, calibrated decisions from any logprob LLM endpoint, H2O-Lightning-4B, Clef-Flash or any System One server, behind one wire contract"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "EDamLabs" }]
keywords = ["system-one", "typesafe", "decision-models", "calibration", "llm", "vllm", "mcp", "h2o-lightning"]
dependencies = [
    "litestar>=2.24",
    "granian>=2.8",
    "msgspec>=0.22",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "httpx>=0.28",
    "numpy>=2.3",
    "scipy>=1.16",
    "beartype>=0.22.9",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-asgi>=0.66b0",
    "openinference-semantic-conventions>=0.1.39",
    "cyclopts>=4.25.3,<5",
    "typesafe-sdk>=0.7.2",
    "openinference-instrumentation-typesafe>=0.1.1",
    "mcp>=2.3.0",
    "huggingface-hub>=2.4",
    "rich>=14.0",
]

[project.scripts]
ejev = "e_jev.cli.main:main"
ejev-mcp = "e_jev.mcp.server:main"

##### DEPS #####
[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "typesafe-sdk>=0.7.2",
    "tach>=0.35.1",
    "pydantic-ai-slim[typesafe]>=2.52.0",
    "pydantic-graph>=2.52.0",
    "pytest-httpserver>=1.2.0",
    "libcst>=1.8",
]

##### IDENTITY #####
[tool.edamlabs]
kind = "service"
family = "eager"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/e_jev"]

##### LINT #####
[tool.ruff]
line-length = 140
target-version = "py314"
src = ["src", "tests"]
### the common spine is materialized byte for byte (`make common`): its source of truth lints it, `make common-check` gates it.
extend-exclude = [
    "src/e_jev/infra/config/base.py",
    "src/e_jev/infra/errors.py",
    "src/e_jev/infra/logger.py",
    "src/e_jev/infra/proxy.py",
    "src/e_jev/ports/provider.py",
]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004", "ARG", "FBT", "TC001", "TC002", "TC003"]
### litestar, msgspec and beartype resolve annotations at runtime — type-checking imports would break them.
"src/e_jev/**" = ["TC001", "TC002", "TC003"]
### pydantic-graph's StepFunction protocol names the parameter `ctx`, used or not; its types resolve at runtime.
"tests/integration/scenarios/**" = ["ARG001", "TC001", "TC002", "TC003"]
"scripts/**" = ["T20", "INP001", "TC003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["e_jev", "tests"]

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

### ty 0.0.84 cannot match pydantic-graph's Step against its class-scoped `Source[T]` alias once the builder has
### typed state or deps (pyright: 0 errors on the same file). Scoped to the one file and rule; drop when ty fixes it.
[[tool.ty.overrides]]
include = ["tests/integration/scenarios/triage/graph.py"]
rules = { invalid-argument-type = "ignore" }

##### TEST #####
[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not integration"]
pythonpath = ["."]
markers = ["integration: needs a live System One endpoint at JEV_URL (make integration)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore:Exception ignored in.*connect_tcp.*:pytest.PytestUnraisableExceptionWarning"]
