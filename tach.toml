##### ROOTS #####
source_roots = ["src"]
exclude = ["tests"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
### Ordered high → low: a layer may import lower layers, importing upward fails. The doors (entry, api) and the
### composition roots inside them are the only modules that name a concretion; engines and providers meet only through
### ports; the core of infra (errors, logger) sits under everything, its settings above the contracts they type.
layers = ["entry", "api", "logic", "engines", "providers", "ports", "config", "models", "ops", "infra"]

##### MODULES #####
[[modules]]
path = "e_jev.main"
layer = "entry"
depends_on = []

[[modules]]
path = "e_jev.cli"
layer = "entry"
depends_on = []

[[modules]]
path = "e_jev.mcp"
layer = "entry"
depends_on = ["e_jev.cli"]

[[modules]]
path = "e_jev.api"
layer = "api"
depends_on = []

[[modules]]
path = "e_jev.api.lifespan"
layer = "api"
depends_on = []

[[modules]]
path = "e_jev.logic.decision"
layer = "logic"
depends_on = ["e_jev.logic.calibration"]

[[modules]]
path = "e_jev.logic.readout"
layer = "logic"
depends_on = []

[[modules]]
path = "e_jev.logic.calibration"
layer = "logic"
depends_on = []

[[modules]]
path = "e_jev.engines"
layer = "engines"
depends_on = []

[[modules]]
path = "e_jev.providers"
layer = "providers"
depends_on = []

[[modules]]
path = "e_jev.ports"
layer = "ports"
depends_on = []

[[modules]]
path = "e_jev.infra.config.providers"
layer = "config"
depends_on = []

[[modules]]
path = "e_jev.infra.config.logic"
layer = "config"
depends_on = []

[[modules]]
path = "e_jev.infra.config.api"
layer = "config"
depends_on = []

[[modules]]
