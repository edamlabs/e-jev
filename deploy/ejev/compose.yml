services:

  ejev:
    image: ghcr.io/damvolkov/e-jev:latest
    container_name: ejev
    hostname: ejev
    # systemd owns this container's lifecycle (unit + gated ExecStartPre). A docker restart policy
    # would let the daemon revive it unordered after a dockerd crash — beside a still-loading vLLM,
    # which poisons the reader probe and parks /ready at 503 until the next manual restart.
    restart: "no"
    labels:
      e-core.category: "ai"
      e-core.port: "45160"
    ports:
      # 45160 — e-jev typed decisions (ai)
      - "${JEV_PORT:-45160}:45160"
    volumes:
      - ../data/ejev:/data
    environment:
      # e-jev = el lector sobre el vLLM de casa (Gemma 4 26B-A4B): bench 2026-11-10, WorkflowEvals 0.625, el mejor
      # medido y el único que convive con el resto de la tarjeta. `make gpu-h2o` / `gpu-decide` escriben JEV_BACKENDS
      # en el .env de este directorio y le dan la tarjeta al modelo de decisión; `make gpu-teach` lo borra.
      - JEV_BACKENDS=${JEV_BACKENDS:-reading}
      - JEV_READING_URL=http://vllm:45100/v1
      - JEV_READING_KEY=${VLLM_API_KEY:-local-dev}
      - JEV_READING_MODEL=${JEV_READING_MODEL:-gemma4-26b-a4b}
      # vLLM corre con --scheduling-policy priority: jev es carga masiva, detrás de los clientes interactivos (0).
      - JEV_READING_PRIORITY=${JEV_READING_PRIORITY:-10}
      - JEV_H2O_URL=http://h2o:8741
      - JEV_CLEF_URL=http://clef:8080
      - JEV_PERMUTATIONS=${JEV_PERMUTATIONS:-1}
      - JEV_OTLP_ENDPOINT=${JEV_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      - JEV_DECISION_LOG=${JEV_DECISION_LOG:-/data/decisions.jsonl}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:45160/ready')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - e-core

networks:
  e-core:
    external: true
