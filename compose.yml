# e-jev, installable: one variable picks the backends, the weights download themselves.
#
#   cp .env.example .env          # JEV_BACKENDS=h2o-lightning-4b (or reading, clef-flash, systemone, comma-separated)
#   docker compose up -d --build  # models → the backend's server → ejev on :45160
#
# COMPOSE_PROFILES follows JEV_BACKENDS (.env.example), so a catalog name both selects the backend in ejev and starts
# its server here. `models` runs `ejev pull` once per `up`: pinned Hub snapshots into the `models` volume, a no-op when
# complete. `reading` and `systemone` start no server: their endpoint is yours (JEV_READING_URL, JEV_SYSTEMONE_URL).
name: ejev

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:

  models:
    build: .
    image: ejev:local
    command: ["ejev", "pull"]
    environment:
      - JEV_BACKENDS=${JEV_BACKENDS:-reading}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - models:/models
    restart: "no"

  h2o:
    profiles: ["h2o-lightning-4b"]
    build: deploy/h2o
    image: ejev-h2o:local
    <<: *gpu
    ipc: host
    depends_on:
      models:
        condition: service_completed_successfully
    environment:
      # two-way reading, H2O's recommended mode (our bench: WorkflowEvals 0.549 vs 0.521 one-way, within noise); 0 = one-way.
      - TWO_WAY=${H2O_TWO_WAY:-1}
      - GPU_UTIL=${H2O_GPU_UTIL:-0.85}
      - MAX_LEN=${H2O_MAX_LEN:-32768}
      - HOME=/cache
    volumes:
      - models:/models
      - h2o-cache:/cache
    healthcheck:
      # the shim answers 503 ("warming") until every path is warmed: ready means ready to decide.
      test: ["CMD-SHELL", "curl -sf http://localhost:8741/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30m
    restart: unless-stopped

  clef:
    profiles: ["clef-flash"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    <<: *gpu
    depends_on:
      models:
        condition: service_completed_successfully
    # the joint decision head reads the whole prompt in one batch: -ub bounds the state (~4k tokens at 4096).
    command: ["-m", "/models/clef-flash/Clef-Flash-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080",
              "-c", "${CLEF_CTX:-32768}", "-ngl", "99", "-b", "${CLEF_BATCH:-32768}", "-ub", "${CLEF_UBATCH:-4096}"]
    volumes:
      - models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 5m
    restart: unless-stopped

  ejev:
    build: .
    image: ejev:local
    depends_on:
      models:
        condition: service_completed_successfully
      h2o:
        condition: service_healthy
        required: false
      clef:
        condition: service_healthy
        required: false
    ports:
      - "${JEV_PORT:-45160}:45160"
    env_file:
      - path: .env
        required: false
    environment:
      - JEV_BACKENDS=${JEV_BACKENDS:-reading}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:45160/ready')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  models:
  h2o-cache:
  data:
